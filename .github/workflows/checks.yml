name: Comprobar cambios
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            setup/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix setup
      - run: npm --prefix setup run build
