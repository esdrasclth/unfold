[package]
name = "unfold"
version = "0.5.0"
description = "Editor Markdown con vista previa en vivo"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "unfold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# La vigilancia de archivos no viene de serie: sin la feature `watch` el
# comando existe en JavaScript pero no hay nada detras que lo atienda.
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# Necesario para reiniciar la aplicacion tras instalar la actualizacion.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Motor Git nativo. En esta fase se enlaza con clone/fetch/push reales para
# poder medir su impacto en el binario y validar el flujo antes de construir UI.
git2 = { version = "0.21", features = ["https", "vendored-libgit2", "vendored-openssl"] }
keyring = "4.2"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls-no-provider"] }
# `rustls-no-provider` deja la elección del proveedor criptográfico al programa,
# así que hay que declararlo. Se usa ring, el mismo que ya instala el plugin del
# actualizador, para no arrastrar un segundo proveedor al binario. Sin
# `default-features = false` rustls traería aws-lc-rs, que en Windows exige NASM.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["sync"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2.4.4"

[dev-dependencies]
tempfile = "3"

# Sólo para pedirle a Windows 11 las esquinas redondeadas de la ventana. La
# version se hace coincidir con la que ya arrastra Tauri para no compilar dos.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
] }

# Un binario pequeno y rapido pesa mas que compilar rapido en release.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
