[package]
name = "unfold"
version = "0.1.0"
description = "Editor Markdown con vista previa en vivo"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "unfold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# La vigilancia de archivos no viene de serie: sin la feature `watch` el
# comando existe en JavaScript pero no hay nada detras que lo atienda.
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Sólo para pedirle a Windows 11 las esquinas redondeadas de la ventana. La
# version se hace coincidir con la que ya arrastra Tauri para no compilar dos.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
] }

# Un binario pequeno y rapido pesa mas que compilar rapido en release.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
